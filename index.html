<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Let's Hunt Some Orc!</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body data-mode="run">
<div class="wrap">
  <header>
    <h1>Let's Hunt Some <em>Orc!</em></h1>
    <div class="hud" id="hud">
      <div class="hud-wallbox">
        <div class="hud-wall" id="hud-wall" data-tone="high" data-crack="0">
          <div class="trail" id="hud-wall-trail"></div><div class="fill" id="hud-wall-fill"></div>
          <svg class="cracks" viewBox="0 0 320 40" aria-hidden="true"><g class="ticks"><rect x="93.0" y="12" width="2" height="16"/><rect x="159.0" y="12" width="2" height="16"/><rect x="225.0" y="12" width="2" height="16"/></g><g class="c1"><g class="cr"><g class="lip"><polygon points="230.5,3.0 226.1,10.8 234.5,16.9 227.7,23.3 236.1,29.6 229.3,36.0 229.3,36.0 236.9,29.6 229.1,23.1 236.7,16.7 228.9,10.0 233.5,5.0" transform="translate(1.1 -0.6)"/><polygon points="235.2,15.8 227.5,19.3 222.6,18.8 222.6,18.8 227.7,20.3 236.0,17.8" transform="translate(1.1 -0.6)"/><polygon points="228.0,24.1 235.1,26.6 239.4,30.2 239.4,30.2 235.7,25.8 228.8,22.3" transform="translate(1.1 -0.6)"/></g><g class="core"><polygon points="230.5,3.0 226.1,10.8 234.5,16.9 227.7,23.3 236.1,29.6 229.3,36.0 229.3,36.0 236.9,29.6 229.1,23.1 236.7,16.7 228.9,10.0 233.5,5.0"/><polygon points="235.2,15.8 227.5,19.3 222.6,18.8 222.6,18.8 227.7,20.3 236.0,17.8"/><polygon points="228.0,24.1 235.1,26.6 239.4,30.2 239.4,30.2 235.7,25.8 228.8,22.3"/></g></g></g><g class="c2"><g class="cr"><g class="lip"><polygon points="148.4,4.9 152.2,9.9 144.4,16.9 153.8,23.3 146.9,29.6 153.6,36.0 153.6,36.0 147.7,29.6 155.2,23.1 146.6,16.7 155.0,10.9 151.6,3.1" transform="translate(1.1 -0.6)"/><polygon points="145.1,15.8 137.4,19.3 132.5,18.8 132.5,18.8 137.6,20.3 145.9,17.8" transform="translate(1.1 -0.6)"/><polygon points="154.1,24.1 161.2,26.6 165.5,30.2 165.5,30.2 161.8,25.8 154.9,22.3" transform="translate(1.1 -0.6)"/></g><g class="core"><polygon points="148.4,4.9 152.2,9.9 144.4,16.9 153.8,23.3 146.9,29.6 153.6,36.0 153.6,36.0 147.7,29.6 155.2,23.1 146.6,16.7 155.0,10.9 151.6,3.1"/><polygon points="145.1,15.8 137.4,19.3 132.5,18.8 132.5,18.8 137.6,20.3 145.9,17.8"/><polygon points="154.1,24.1 161.2,26.6 165.5,30.2 165.5,30.2 161.8,25.8 154.9,22.3"/></g></g></g><g class="c3"><g class="cr"><g class="lip"><polygon points="70.4,3.1 67.0,10.9 75.4,16.7 66.8,23.1 75.2,29.6 68.4,36.0 68.4,36.0 76.0,29.6 68.2,23.3 77.6,16.9 69.8,9.9 73.6,4.9" transform="translate(1.1 -0.6)"/><polygon points="76.1,15.8 68.4,19.3 63.5,18.8 63.5,18.8 68.6,20.3 76.9,17.8" transform="translate(1.1 -0.6)"/><polygon points="67.1,24.1 74.2,26.6 78.5,30.2 78.5,30.2 74.8,25.8 67.9,22.3" transform="translate(1.1 -0.6)"/></g><g class="core"><polygon points="70.4,3.1 67.0,10.9 75.4,16.7 66.8,23.1 75.2,29.6 68.4,36.0 68.4,36.0 76.0,29.6 68.2,23.3 77.6,16.9 69.8,9.9 73.6,4.9"/><polygon points="76.1,15.8 68.4,19.3 63.5,18.8 63.5,18.8 68.6,20.3 76.9,17.8"/><polygon points="67.1,24.1 74.2,26.6 78.5,30.2 78.5,30.2 74.8,25.8 67.9,22.3"/></g></g><g class="cr"><g class="lip"><polygon points="270.7,8.4 273.8,15.8 267.9,24.0 274.7,32.0 274.7,32.0 268.9,24.0 275.6,16.2 273.3,7.6" transform="translate(1.1 -0.6)"/><polygon points="268.1,23.2 260.3,26.6 255.4,26.0 255.4,26.0 260.5,27.4 268.7,24.8" transform="translate(1.1 -0.6)"/><polygon points="274.4,32.7 281.5,35.3 285.7,39.0 285.7,39.0 281.9,34.7 275.0,31.3" transform="translate(1.1 -0.6)"/></g><g class="core"><polygon points="270.7,8.4 273.8,15.8 267.9,24.0 274.7,32.0 274.7,32.0 268.9,24.0 275.6,16.2 273.3,7.6"/><polygon points="268.1,23.2 260.3,26.6 255.4,26.0 255.4,26.0 260.5,27.4 268.7,24.8"/><polygon points="274.4,32.7 281.5,35.3 285.7,39.0 285.7,39.0 281.9,34.7 275.0,31.3"/></g></g></g></svg>
          <span class="flash" id="hud-wall-flash"></span><span class="lbl" id="hud-wall-t"></span>
        </div>
        <span class="hud-van" id="hud-van" hidden></span>
      </div>
      <div class="hud-star"><span class="hud-gem" id="hud-gem" aria-hidden="true"><span class="cut"></span></span><span class="odo" id="st-star" role="img"></span></div>
      <div class="hud-wave" id="hud-wave"><span class="k" id="k-wave"></span><span class="v" id="st-wave">1</span><span class="stamp" id="hud-stamp" hidden></span></div>
      <div class="stats">
        <div class="stat"><span class="k" id="k-kills"></span><span class="v" id="st-kills">0</span></div>
        <div class="stat"><span class="k" id="k-heart"></span><span class="v heart" id="st-heart">0</span></div>
      </div>
    </div>
    <button class="ghost" id="btn-pullback" hidden></button>
    <button class="ghost" id="btn-settings"></button>
  </header>
  <div class="main">
    <div class="play">
      <div class="field">
        <canvas id="game"></canvas>
        <div class="toast" id="toast"></div>
        <div class="lootbanners" id="loot-banners" aria-live="polite"></div>
        <div class="fallen" id="fallen" hidden>
          <div class="report" id="fallen-board">
            <h2 id="fallen-title"></h2>
            <dl class="tally" id="fallen-rows"></dl>
            <p id="fallen-loot"></p>
            <div class="hwline"><span class="k" id="fallen-hw-k"></span><span class="big" id="fallen-hw">0</span></div>
            <div class="seal" id="fallen-seal" aria-hidden="true"></div>
          </div>
          <button class="march" id="fallen-btn"></button>
        </div>
      </div>
      <div class="rally">
        <button class="deploy boss" id="dep-boss" hidden><span class="n"></span><span class="c"></span></button>
      </div>
    </div>
    <div class="panel">
      <div class="campbar"><h2 id="camp-title"></h2><button class="ghost" id="camp-close"></button><span class="tierpick" id="camp-tier" hidden><button class="ghost" id="tier-down"></button><span id="tier-name"></span><button class="ghost" id="tier-up"></button></span><button class="buy" id="camp-go"></button></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-grove" aria-selected="true"></button>
        <button role="tab" id="tab-satchel" aria-selected="false"></button>
        <button role="tab" id="tab-camp" aria-selected="false"></button>
        <button role="tab" id="tab-prestige" aria-selected="false"></button>
        <button role="tab" id="tab-settings" aria-selected="false"></button>
      </div>
      <div class="tab" id="pane-grove">
        <div class="treewrap"><canvas id="tree" tabindex="0"></canvas><button class="ghost treefull" id="tree-full" type="button"></button></div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
      <div class="tab" id="pane-satchel" hidden>
        <div class="prestige satchel">
          <h2 id="sat-title"></h2>
          <div class="stat"><span class="k" id="sat-worn-k"></span></div>
          <div class="items worn" id="sat-worn"></div>
        <div id="sat-sets" class="sets"></div>
          <div class="itemdetail" id="sat-detail"></div>
          <div class="satbar"><span class="k" id="sat-count"></span><label class="set"><span id="sat-filter-k"></span><select id="sat-filter"></select></label></div>
          <div class="items" id="sat-grid"></div>
        </div>
      </div>
      <div class="tab" id="pane-camp" hidden>
        <div class="campwrap"><canvas id="campview"></canvas><div class="bcard" id="bcard" role="dialog" hidden></div><div class="camplist" id="camp-list"></div></div>
      </div>
      <div class="tab" id="pane-prestige" data-fit="scroll" hidden>
        <div class="prestige replant">
          <h2 id="paths-title"></h2>
          <div class="paths" id="paths"></div>
          <h2 id="hw-title"></h2>
          <div class="hwtree" id="hw-tree"></div>
        </div>
      </div>
      <div class="tab" id="pane-settings" hidden>
        <div class="prestige settings split">
          <div class="col">
          <label class="set"><span id="set-vol-k"></span><input type="range" id="set-vol" min="0" max="1" step="0.05"><output id="set-vol-v"></output></label>
          <label class="set"><span id="set-motion-k"></span><select id="set-motion"><option value="sys"></option><option value="full"></option><option value="reduced"></option></select></label>
          <label class="set"><span id="set-text-k"></span><input type="range" id="set-text" min="0.8" max="1.6" step="0.1"><output id="set-text-v"></output></label>
          <label class="set"><span id="set-num-k"></span><select id="set-num"><option value="short"></option><option value="sci"></option></select></label>
          <h2 id="set-tel-k"></h2>
          <div class="row"><button class="ghost" id="btn-telemetry"></button></div>
          </div>
          <div class="col">
          <h2 id="set-save-k"></h2>
          <textarea id="set-blob" rows="4" spellcheck="false"></textarea>
          <div class="row"><button class="ghost" id="btn-export"></button><button class="ghost" id="btn-import"></button></div>
          <div class="row danger-row"><button class="ghost danger" id="btn-reset"></button></div>
          </div>
        </div>
      </div>
      <div class="footer">
        <span class="auto" id="build"></span>
      </div>
    </div>
  </div>
</div>
<div class="turn" id="turn"><p id="turn-msg"></p></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
