<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<meta name="theme-color" content="#161d15">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<title>Let's Hunt Some Orc!</title>
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="stylesheet" href="/src/ui/style.css">
</head>
<body data-mode="run">
<div class="wrap">
  <header>
    <h1>Let's Hunt Some <em>Orc!</em></h1>
    <div class="hud" id="hud">
      <div class="hud-wallbox">
        <div class="hud-wall" id="hud-wall" data-tone="high" data-crack="0">
          <div class="fill" id="hud-wall-fill"></div>
          <svg class="cracks" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
            <path class="c1" d="M72 0 L70 3 L73 5 L69 8 L71 10"/><path class="c2" d="M47 0 L49 2 L46 5 L48 7 L45 10 M49 2 L53 4"/><path class="c3" d="M22 0 L19 3 L23 4 L20 7 L24 10 M19 3 L15 5 M23 4 L27 6"/>
          </svg>
          <span class="lbl" id="hud-wall-t"></span>
        </div>
        <span class="hud-van" id="hud-van" hidden></span>
      </div>
      <div class="hud-star"><span class="hud-gem" id="hud-gem" aria-hidden="true"><span class="cut"></span></span><span class="odo" id="st-star" role="img"></span></div>
      <div class="hud-wave" id="hud-wave"><span class="k" id="k-wave"></span><span class="v" id="st-wave">1</span><span class="stamp" id="hud-stamp" hidden></span></div>
      <div class="stats">
        <div class="stat"><span class="k" id="k-kills"></span><span class="v" id="st-kills">0</span></div>
        <div class="stat"><span class="k" id="k-heart"></span><span class="v heart" id="st-heart">0</span></div>
      </div>
    </div>
    <button class="ghost" id="btn-pullback" hidden></button>
    <button class="ghost" id="btn-settings"></button>
  </header>
  <button class="mute-corner" id="btn-mute-corner" aria-pressed="false" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none"/><path class="slash" d="M4 4l16 16" fill="none"/></svg></button>
  <div class="main">
    <div class="play">
      <div class="field">
        <canvas id="game"></canvas>
        <div class="toast" id="toast"></div>
        <div class="lootbanners" id="loot-banners" aria-live="polite"></div>
        <div class="fallen" id="fallen" hidden>
          <div class="report" id="fallen-board">
            <h2 id="fallen-title"></h2>
            <dl class="tally" id="fallen-rows"></dl>
            <p id="fallen-loot"></p>
            <div class="hwline"><span class="k" id="fallen-hw-k"></span><span class="big" id="fallen-hw">0</span></div>
            <div class="seal" id="fallen-seal" aria-hidden="true"></div>
          </div>
          <button class="march" id="fallen-btn"></button>
        </div>
      </div>
      <div class="rally">
        <button class="deploy boss" id="dep-boss" hidden><span class="n"></span><span class="c"></span></button>
      </div>
    </div>
    <div class="panel">
      <div class="campbar"><h2 id="camp-title"></h2><button class="ghost" id="camp-close"></button><span class="tierpick" id="camp-tier" hidden><button class="ghost" id="tier-down"></button><span id="tier-name"></span><button class="ghost" id="tier-up"></button></span><button class="buy" id="camp-go"></button></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-grove" aria-selected="true"></button>
        <button role="tab" id="tab-satchel" aria-selected="false"></button>
        <button role="tab" id="tab-camp" aria-selected="false"></button>
        <button role="tab" id="tab-prestige" aria-selected="false"></button>
        <button role="tab" id="tab-settings" aria-selected="false"></button>
      </div>
      <div class="tab" id="pane-grove">
        <div class="treewrap"><canvas id="tree" tabindex="0"></canvas><button class="ghost treefull" id="tree-full" type="button"></button></div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
      <div class="tab" id="pane-satchel" hidden>
        <div class="prestige satchel">
          <h2 id="sat-title"></h2>
          <div class="stat"><span class="k" id="sat-worn-k"></span></div>
          <div class="items worn" id="sat-worn"></div>
        <div id="sat-sets" class="sets"></div>
          <div class="itemdetail" id="sat-detail"></div>
          <div class="satbar"><span class="k" id="sat-count"></span><label class="set"><span id="sat-filter-k"></span><select id="sat-filter"></select></label></div>
          <div class="items" id="sat-grid"></div>
        </div>
      </div>
      <div class="tab" id="pane-camp" hidden>
        <div class="campwrap"><canvas id="campview"></canvas><div class="bcard" id="bcard" role="dialog" hidden></div><div class="camplist" id="camp-list"></div></div>
      </div>
      <div class="tab" id="pane-prestige" data-fit="scroll" hidden>
        <div class="prestige replant">
          <h2 id="paths-title"></h2>
          <div class="paths" id="paths"></div>
          <h2 id="hw-title"></h2>
          <div class="hwtree" id="hw-tree"></div>
        </div>
      </div>
      <div class="tab" id="pane-settings" hidden>
        <div class="prestige settings split">
          <div class="col">
          <label class="set"><span id="set-vol-k"></span><input type="range" id="set-vol" min="0" max="1" step="0.05"><output id="set-vol-v"></output></label>
          <label class="set"><span id="set-motion-k"></span><select id="set-motion"><option value="sys"></option><option value="full"></option><option value="reduced"></option></select></label>
          <label class="set"><span id="set-quality-k"></span><select id="set-quality"><option value="auto"></option><option value="high"></option><option value="low"></option></select></label>
          <label class="set"><span id="set-text-k"></span><input type="range" id="set-text" min="0.8" max="1.6" step="0.1"><output id="set-text-v"></output></label>
          <label class="set"><span id="set-num-k"></span><select id="set-num"><option value="short"></option><option value="sci"></option></select></label>
          <h2 id="set-tel-k"></h2>
          <div class="row"><button class="ghost" id="btn-telemetry"></button></div>
          <div class="row" id="row-fs"><button class="ghost" id="btn-fs"></button></div>
          <div class="row"><button class="ghost" id="btn-mute" aria-pressed="false"></button></div>
          </div>
          <div class="col">
          <h2 id="set-save-k"></h2>
          <textarea id="set-blob" rows="4" spellcheck="false"></textarea>
          <div class="row"><button class="ghost" id="btn-export"></button><button class="ghost" id="btn-import"></button></div>
          <div class="row danger-row"><button class="ghost danger" id="btn-reset"></button></div>
          </div>
        </div>
      </div>
      <div class="footer">
        <span class="auto" id="build"></span>
      </div>
    </div>
  </div>
</div>
<div class="turn" id="turn"><p id="turn-msg"></p></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
