name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: 1 }   # the web build never runs Electron
      - run: npm run lint
      - run: npm test
      - run: npm run balance -- --minutes 30 --policy greedy --quiet
      - run: npm run build
